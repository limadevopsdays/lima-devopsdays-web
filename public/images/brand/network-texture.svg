    <circle cx="300" cy="440" r="5" class="net-node-core" />

    <circle cx="480" cy="490" r="16" class="net-node" />
    <circle cx="480" cy="490" r="7" class="net-node-core" />

    <circle cx="660" cy="430" r="13" class="net-node" />
    <circle cx="660" cy="430" r="5.5" class="net-node-core" />

