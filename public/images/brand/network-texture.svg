<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .net-line {
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-opacity: 0.35;
        stroke-linecap: round;
      }
      .net-node {
        fill: currentColor;
        fill-opacity: 0.45;
      }
      .net-node-core {
        fill: currentColor;
        fill-opacity: 0.85;
      }
    </style>
